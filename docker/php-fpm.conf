[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000
listen.owner = www-data
listen.group = www-data

; Modo dinámico: escala workers según demanda
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; Timeouts
request_terminate_timeout = 300

; Logs
php_admin_value[error_log] = /var/log/supervisor/php-fpm.err.log
php_admin_flag[log_errors] = on
